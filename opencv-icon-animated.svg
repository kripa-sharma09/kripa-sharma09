<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#5C3EE8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5C3EE8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background card -->
  <rect x="2" y="2" width="116" height="116" rx="18" fill="#0d1117" stroke="#5C3EE8" stroke-width="2"/>

  <circle cx="60" cy="58" r="46" fill="url(#glow)">
    <animate attributeName="r" values="42;48;42" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- OpenCV mark: three interlocking rings, bouncing as a group -->
  <g transform="translate(60,58)">
    <animateTransform attributeName="transform" type="translate"
      values="60,58; 60,52; 60,58" dur="1.2s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>

    <circle cx="0" cy="-16" r="13" fill="none" stroke="#EE4A2F" stroke-width="7"/>
    <circle cx="-14" cy="9" r="13" fill="none" stroke="#66B32E" stroke-width="7"/>
    <circle cx="14" cy="9" r="13" fill="none" stroke="#2F63EE" stroke-width="7"/>
  </g>

  <!-- label -->
  <text x="60" y="104" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="15" font-weight="700" fill="#e6edf3">OpenCV</text>
</svg>
